function findFamilyXX (id) {
	// local output accumulator
	let out = ''

	// case 1: person exists and has a family group
	if (db[id] && db[id].fg) {
		let person = db[id]
		let fg = person.fg

		// open details wrapper
		out += '<details>'

		// summary head
		out += `<summary class="lineHead"`
		if (id === window.thisPerson) out += ` style="color:chocolate; font-size: 1.4rem;"`
		out += `><span class="n"><input type="checkbox" checked title="${ id }" onclick="if (this.checked===false) clearChecks(this.parentNode.parentNode.parentNode)"> <a href="tree.html?project=${ project }&person=${ id }" style="float:none; color: black;">${ person.g } <strong>${ person.f }</strong></a></span>`

		// optional markers
		if (person.intro) out += ' <span class="itag">i</span>'
		if (person.a) out += ' <span class="atag">a</span>'
		if (person.tagged) out += ' <span class="tag">✓</span>'
		if (person.cstatus) out += ' <strong>&bull;</strong>'

		// flag for <100 years
		if (person.b > window.currentYear - 100) out += ` <a href="person.html?project=${ window.project }&person=${ id }" title="Born less than 100 years ago." style="margin-inline:.1rem; opacity:80%;">🚩</a>`

		// basic fields
		out += ' <span class="dates">' + person.b + '–' + person.d + '</span>'
		out += ' <span class="bplace">' + person.bplace + '</span>'
		out += ' <span class="occ">' + person.occ + '</span>'
		out += '</summary>'

		// iterate family groups
		for (let g = 0; g < fg.length; g++) {
			// spouse exists in db
			if (db[person.fg[g][1]]) {
				let sid = person.fg[g][1]
				let spouse = db[sid]

				// spouse line
				out += `<p class="spouse"><span class="spousen"><input type="checkbox" checked title="${ sid }"> <a href="tree.html?project=${ project }&person=${ sid }" style="float:none; color: black;">${ spouse.g } ${ spouse.f }</a>`

				// optional markers
				if (person.intro) out += ' <span class="itag">i</span>'
				if (person.a) out += ' <span class="atag">a</span>'
				if (person.tagged) out += ' <span class="tag">✓</span>'

				// spouse <100 years flag
				if (spouse.b > window.currentYear - 100) out += ` <a href="person.html?project=${ window.project }&person=${ sid }" title="Show details" style="margin-inline:.1rem; opacity:80%;">🚩</a>`

				// spouse details
				out += ' <span class="dates">' + spouse.b + '–' + spouse.d + ', &nbsp; marr ' + person.fg[g][0] + '</span>'
				out += ' <span class="bplace">' + spouse.bplace + '</span>'
				out += ' <span class="occ">' + spouse.occ + '</span>'
				out += '</span></p>'
			}

			// spouse not in db (string only)
			else if (person.fg[g][1]) {
				out += `<p class="spouse"><span class="spousen"><input type="checkbox" checked title="${ id }"> ${ person.fg[g][1] }</span></p>`
			}

			// children
			for (let i = 2; i < person.fg[g].length; i++) out += findFamily(person.fg[g][i])
		}

		out += '</details>'
	}

	// case 2: person exists but has no family group
	else if (db[id]) {
		let person = db[id]

		out += '<details>'
		out += '<summary'

		// choose class based on completion status
		if (person.cstatus) out += ' class="lineEnd"'
		else out += ' class="lineTBD"'

		out += `><span class="n"><input type="checkbox" checked title="${ id }"> ${ person.g } ${ person.f }</span>`

		// optional markers
		if (person.intro) out += ' <span class="itag">i</span>'
		if (person.a) out += ' <span class="atag">a</span>'
		if (person.tagged) out += ' <span class="tag">✓</span>'

		// <100 years flag
		if (person.b > window.currentYear - 100) out += ` <a href="person.html?project=${ window.project }&person=${ id }" title="Show details" style="margin-inline:.1rem; opacity:80%;">🚩</a>`

		// basic fields
		out += ' <span class="dates">' + person.b + '–' + person.d + '</span>'
		out += ' <span class="occ">' + person.occ + '</span>'
		out += ' <span class="bplace">' + person.bplace + '</span>'
		out += '</summary>'
		out += '</details>'
	}

	// return accumulated HTML
	return out
}




// checkbox + name link for a person
function renderPersonName (id, g, f) {
	return `<span class="n"><input type="checkbox" checked title="${ id }"> <a class="personLink" href="tree.html?project=${ project }&person=${ id }">${ g } <strong>${ f }</strong></a></span>`
}

// checkbox + name link for a spouse
function renderSpouseName (id, g, f) {
	return `<span class="spousen"><input type="checkbox" checked title="${ id }"> <a class="personLink" href="tree.html?project=${ project }&person=${ id }">${ g } ${ f }</a>`
}

// markers (i, a, ✓)
function renderMarkers (person) {
	let out = ''
	if (person.intro) out += ' <span class="itag">i</span>'
	if (person.a) out += ' <span class="atag">a</span>'
	if (person.tagged) out += ' <span class="tag">✓</span>'
	return out
}

// flag logic (⚐ or ⚑)
function renderFlagX (b, d, id) {
	if (b <= window.currentYear - 100) return ''
	let flag = d ? '⚐' : '⚑'
	return ` <a class="flag" href="person.html?project=${ window.project }&person=${ id }" title="Born less than 100 years ago.">${ flag }</a>`
}
function renderFlag (b, d, id) {
	let birth = Number(b)

	// only show flag if birth year is a valid number AND <100 years ago
	if (!birth || birth <= window.currentYear - 100) return ''

	let flag = d ? '⚐' : '⚑'
	return ` <a class="flag" href="person.html?project=${ window.project }&person=${ id }" title="Born less than 100 years ago.">${ flag }</a>`
}


// dates span
function renderDates (b, d, marr) {
	if (marr) return ` <span class="dates">${ b }–${ d }, &nbsp; marr ${ marr }</span>`
	return ` <span class="dates">${ b }–${ d }</span>`
}

// birthplace span
function renderBirthplace (place) {
	return ` <span class="bplace">${ place }</span>`
}

// occupation span
function renderOccupation (occ) {
	return ` <span class="occ">${ occ }</span>`
}



function findFamily (id) {
	// local output accumulator
	let out = ''

	// case 1: person exists and has a family group
	if (db[id] && db[id].fg) {
		let person = db[id]
		let fg = person.fg

		// open details wrapper
		out += '<details>'

		// summary head
		out += `<summary class="lineHead"`
		if (id === window.thisPerson) out += ` class="lineHead thisPerson"`
		out += `>${ renderPersonName(id, person.g, person.f) }`

		// markers
		out += renderMarkers(person)

		// flag
		out += renderFlag(person.b, person.d, id)

		// basic fields
		out += renderDates(person.b, person.d)
		out += renderBirthplace(person.bplace)
		out += renderOccupation(person.occ)

		out += '</summary>'

		// iterate family groups
		for (let g = 0; g < fg.length; g++) {
			let sid = person.fg[g][1]

			// spouse exists in db
			if (db[sid]) {
				let spouse = db[sid]

				out += `<p class="spouse">${ renderSpouseName(sid, spouse.g, spouse.f) }`

				// markers
				out += renderMarkers(person)

				// spouse flag
				out += renderFlag(spouse.b, spouse.d, sid)

				// spouse details
				out += renderDates(spouse.b, spouse.d, person.fg[g][0])
				out += renderBirthplace(spouse.bplace)
				out += renderOccupation(spouse.occ)

				out += '</span></p>'
			}

			// spouse not in db (string only)
			else if (sid) {
				out += `<p class="spouse"><span class="spousen"><input type="checkbox" checked title="${ id }"> ${ sid }</span></p>`
			}

			// children
			for (let i = 2; i < person.fg[g].length; i++) out += findFamily(person.fg[g][i])
		}

		out += '</details>'
	}

	// case 2: person exists but has no family group
	else if (db[id]) {
		let person = db[id]

		out += '<details>'
		out += '<summary'

		// choose class based on completion status
		if (person.cstatus) out += ' class="lineEnd"'
		else out += ' class="lineTBD"'

		out += `>${ renderPersonName(id, person.g, person.f) }`

		// markers
		out += renderMarkers(person)

		// flag
		out += renderFlag(person.b, person.d, id)

		// basic fields
		out += renderDates(person.b, person.d)
		out += renderOccupation(person.occ)
		out += renderBirthplace(person.bplace)

		out += '</summary>'
		out += '</details>'
	}

	// return accumulated HTML
	return out
}

    if (type === 'dates') for (let i=0;i<dates.length;i++) dates[i].style.display = 'inline'
    else if (type === 'bplace') for (let i=0;i<bplace.length;i++) bplace[i].style.display = 'inline'
    else if (type === 'occ')for (let i=0;i<occ.length;i++) occ[i].style.display = 'inline'
    }


function uncheckAll () {
    // removes check marks from all names
    persons = document.querySelectorAll('input[type=checkbox]')
    for (var i=0;i<persons.length;i++) persons[i].checked = false
    }


function clearChecks (node) {
    // removes check marks from names below a family head
    persons = node.querySelectorAll('input[type=checkbox]')
    for (var i=0;i<persons.length;i++) persons[i].checked = false
    }


function checkFromList () {
    // removes all checks, then checks people in a list at the top of the page
    uncheckAll()
    checkedNames = document.getElementById('listOfCheckedNames').value.split('\n')
    const checkedNameSet = new Set(checkedNames)
    
    persons = document.querySelectorAll('input[type=checkbox]')
    for (var i=0;i<persons.length;i++) if (checkedNameSet.has(persons[i].title)) persons[i].checked = true
    }


function listChecked () {
    // creates an array of ids for all checked names
    window.checkedNames = []
    persons = document.querySelectorAll('input[type=checkbox]')
    for (var i=0;i<persons.length;i++) if (persons[i].checked) window.checkedNames.push(persons[i].title)
    window.checkedNames.sort()
    
    document.getElementById('listOfCheckedNames').value = window.checkedNames.join('\n') 
    document.getElementById('listOfCheckedNames').style.display = 'block'
    document.getElementById('listOfCheckedNames').select()
    }


function uncheck100 () {
    // highlights and unchecks all people who were born less than 100 years ago, and have not died
    var nodes, input, byear
    uncheckAll()
    
    var nodes = document.querySelectorAll('.n, .spousen')
    for (var i=0;i<nodes.length;i++) {
        input = nodes[i].querySelector('input')
        if (input) {
            found = false
            if (db[input.title]) {
                byear = db[input.title].b
                dyear = db[input.title].d
                //console.log(input.title, byear, dyear)
                if (dyear === '' && parseInt(byear) > 1920) {
                    nodes[i].style.color = 'red'
                    nodes[i].style.border = '1px solid red'
                    input.checked = true
                    }
                else if (parseInt(byear) > 1920) {
                    nodes[i].style.color = 'green'
                    nodes[i].style.border = '1px solid green'
                    }
                }
            
            }
        }
    }
